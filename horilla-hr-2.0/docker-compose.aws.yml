# Extra settings for running Horilla on an AWS EC2 server (demo setup).
# Used together with docker-compose.yml (see COMPOSE_FILE in .env).
services:
  web:
    # EC2 stop/start brings the Docker daemon back up, but a container with no
    # restart policy stays dead until someone runs `docker compose up -d`.
    # The scheduler already restarts itself (see docker-compose.yml); the web
    # tier, database and cache did not, which meant every instance restart
    # required a manual SSH session.
    restart: unless-stopped
    environment:
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,${PUBLIC_HOST}
      - CSRF_TRUSTED_ORIGINS=http://${PUBLIC_HOST}:8000
      - DB_INIT_PASSWORD=${DB_INIT_PASSWORD}
      - TIME_ZONE=Asia/Manila
      # HR -> Limbus Integration Gateway (token set in .env on the server)
      - LIMBUS_GATEWAY_URL=${LIMBUS_GATEWAY_URL:-http://localhost:8088/api/v1/integration}
      - LIMBUS_HR_TOKEN=${LIMBUS_HR_TOKEN:-}
      - LIMBUS_HTTP_TIMEOUT=${LIMBUS_HTTP_TIMEOUT:-15}
      - LIMBUS_OUTBOX_MAX_ATTEMPTS=${LIMBUS_OUTBOX_MAX_ATTEMPTS:-5}
      - LIMBUS_OUTBOX_BATCH_SIZE=${LIMBUS_OUTBOX_BATCH_SIZE:-50}
      - LIMBUS_AUTO_PUBLISH=${LIMBUS_AUTO_PUBLISH:-True}
      - LIMBUS_VERIFY_SSL=${LIMBUS_VERIFY_SSL:-True}
      - PYTHONHTTPSVERIFY=${PYTHONHTTPSVERIFY:-}
  scheduler:
    environment:
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,${PUBLIC_HOST}
      - DB_INIT_PASSWORD=${DB_INIT_PASSWORD}
      - TIME_ZONE=Asia/Manila
      # HR -> Limbus Integration Gateway (token set in .env on the server)
      - LIMBUS_GATEWAY_URL=${LIMBUS_GATEWAY_URL:-http://localhost:8088/api/v1/integration}
      - LIMBUS_HR_TOKEN=${LIMBUS_HR_TOKEN:-}
      - LIMBUS_HTTP_TIMEOUT=${LIMBUS_HTTP_TIMEOUT:-15}
      - LIMBUS_OUTBOX_MAX_ATTEMPTS=${LIMBUS_OUTBOX_MAX_ATTEMPTS:-5}
      - LIMBUS_OUTBOX_BATCH_SIZE=${LIMBUS_OUTBOX_BATCH_SIZE:-50}
      - LIMBUS_AUTO_PUBLISH=${LIMBUS_AUTO_PUBLISH:-True}
      - LIMBUS_VERIFY_SSL=${LIMBUS_VERIFY_SSL:-True}
      - PYTHONHTTPSVERIFY=${PYTHONHTTPSVERIFY:-}
  db:
    restart: unless-stopped
  redis:
    restart: unless-stopped
