{% load i18n %}
<div id="formContainer">
    {% include "generic/horilla_form.html" %}
</div>

<script>
    function toggleNotify(elm) {
        $this = $(elm).val()

        if ($this) {
            $("#id_notify_before_parent_div").show()
        } else {
            $("#id_notify_before_parent_div").hide()
        }
    }
    $(document).ready(function(){
        toggleNotify($("#id_expiry_date"));
        var procDiv = $("#id_purchase_reference_parent_div");
        if (procDiv.length && !$("#procurementSectionHeader").length) {
            procDiv.before(
                '<div id="procurementSectionHeader" class="col-12 mt-3 mb-1">' +
                '<hr class="my-2">' +
                '<h6 class="fw-bold text-uppercase" style="font-size: 0.8rem; letter-spacing: 0.04em; color: #4b5563;">' +
                '{% trans "Procurement" %}' +
                '</h6></div>'
            );
        }
    })
</script>
