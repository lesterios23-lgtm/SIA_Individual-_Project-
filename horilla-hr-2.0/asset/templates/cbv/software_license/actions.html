{% load i18n %}
<div class="flex items-center justify-center gap-1" onclick="event.stopPropagation()">
    {% if perms.asset.change_asset %}
        <a
            class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
            title="{% trans 'Allocate Seat' %}"
            data-toggle="oh-modal-toggle"
            data-target="#genericModal"
            hx-get="{{ instance.get_allocate_url }}"
            hx-target="#genericModalBody"
        >
            <ion-icon name="person-add-outline"></ion-icon>
        </a>
        <a
            class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
            title="{% trans 'Update' %}"
            data-toggle="oh-modal-toggle"
            data-target="#genericModal"
            hx-get="{{ instance.get_update_url }}"
            hx-target="#genericModalBody"
        >
            <ion-icon name="create-outline"></ion-icon>
        </a>
    {% endif %}
    {% if perms.asset.delete_asset %}
        <form
            hx-confirm="{% trans 'Do you want to delete this software license?' %}"
            hx-post="{{ instance.get_delete_url }}"
            hx-target="#SoftwareLicenseList"
        >
            {% csrf_token %}
            <button
                class="oh-btn oh-btn--danger oh-btn--sq-sm"
                title="{% trans 'Delete' %}"
            >
                <ion-icon name="trash-outline"></ion-icon>
            </button>
        </form>
    {% endif %}
</div>
