{% load i18n %}
<div class="oh-dropdown__filter-body">
    <div class="oh-accordion">
        <div class="oh-accordion-header">{% trans "Software License" %}</div>
        <div class="oh-accordion-body">
            <div class="row">
                <div class="col-sm-12 col-md-12 col-lg-6">
                    <div class="oh-input-group">
                        <label class="oh-label" for="{{ form.status.id_for_label }}">
                            {% trans "Status" %}
                        </label>
                        {{ form.status }}
                    </div>
                </div>
                <div class="col-sm-12 col-md-12 col-lg-6">
                    <div class="oh-input-group">
                        <label class="oh-label" for="{{ form.vendor.id_for_label }}">
                            {% trans "Vendor" %}
                        </label>
                        {{ form.vendor }}
                    </div>
                </div>
                <div class="col-sm-12 col-md-12 col-lg-12">
                    <div class="oh-input-group">
                        <label class="oh-label" for="{{ form.renewal_owner.id_for_label }}">
                            {% trans "Renewal Owner" %}
                        </label>
                        {{ form.renewal_owner }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
