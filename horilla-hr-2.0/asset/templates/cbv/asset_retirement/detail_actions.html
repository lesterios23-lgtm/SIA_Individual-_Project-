{% load i18n %}
<div class="oh-btn-group w-100">
    {% if instance.evidence_file %}
        <a
            href="{{ instance.evidence_file.url }}"
            target="_blank"
            class="oh-btn oh-btn--info w-100"
        >
            <ion-icon name="document-attach-outline"></ion-icon>
            {% trans "Evidence" %}
        </a>
    {% endif %}
    {% if perms.asset.change_asset %}
        <button
            data-toggle="oh-modal-toggle"
            data-target="#genericModal"
            hx-get="{{ instance.get_update_url }}"
            hx-target="#genericModalBody"
            class="oh-btn oh-btn--light-bkg oh-btn--secondary w-100"
        >
            <ion-icon name="create-outline"></ion-icon>
            {% trans "Edit" %}
        </button>
    {% endif %}
    {% if perms.asset.delete_asset %}
        <button
            hx-confirm="{% trans 'Do you want to delete this retirement record?' %}"
            hx-post="{{ instance.get_delete_url }}"
            hx-target="#AssetRetirementList"
            hx-on:click="$(this).closest('.oh-modal--show').removeClass('oh-modal--show')"
            class="oh-btn oh-btn--danger w-100"
        >
            <ion-icon name="trash-outline"></ion-icon>
            {% trans "Delete" %}
        </button>
    {% endif %}
</div>
